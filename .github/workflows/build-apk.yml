name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（使用 runner 预装 SDK）
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          AJ="$SDK/platforms/android-35/android.jar"
          echo "ANDROID_JAR=$AJ" >> "$GITHUB_ENV"
          if [ ! -f "$AJ" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          fi
          echo "BT=$BT"; ls -l "$AJ"

      - name: 下载新版 R8（避免旧版 d8 与 JDK 不兼容）
        run: |
          curl -sSL -o r8.jar \
            https://dl.google.com/dl/android/maven2/com/android/tools/r8/9.5.33/r8-9.5.33.jar
          echo "R8_JAR=$GITHUB_WORKSPACE/r8.jar" >> "$GITHUB_ENV"

      - name: 构建（使用仓库内固定的 debug.keystore）
        run: bash build.sh

      - name: 校验签名证书指纹
        run: |
          echo "keystore 指纹："
          keytool -list -v -keystore debug.keystore -alias netease -storepass android | grep -E 'SHA1|SHA256'
          echo "APK 签名指纹："
          keytool -printcert -jarfile output/NeteaseLite-v1.0.apk | grep -E 'SHA1|SHA256'

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: netease-lite-apk
          path: output/*.apk
          if-no-files-found: error
